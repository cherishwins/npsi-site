<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- NPSI Working Paper No. 1 — Open Graph card. 1200×630. -->
  <!-- Palette: Pacific Navy #F4EFE3, Treaty Bronze #C08D60, Maritime Teal #7FA8B5, Document Cream #081C30 -->

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .serif { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif; }
      .mono  { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#081C30"/>

  <text x="64" y="80" class="serif" font-weight="600" font-size="13" letter-spacing="3.4" fill="#F4EFE3">
    NORTH PACIFIC STRATEGY INITIATIVE
  </text>
  <text x="1136" y="80" class="mono" font-size="10.5" letter-spacing="2.2" fill="#C08D60" text-anchor="end">
    WORKING PAPER № 1 · v1.0 · MMXXVI
  </text>

  <line x1="64" y1="108" x2="1136" y2="108" stroke="#C08D60" stroke-width="0.7"/>
  <line x1="64"   y1="103.5" x2="64"   y2="112.5" stroke="#C08D60" stroke-width="1.1"/>
  <line x1="600"  y1="105"   x2="600"  y2="111"   stroke="#C08D60" stroke-width="1"/>
  <line x1="1136" y1="103.5" x2="1136" y2="112.5" stroke="#C08D60" stroke-width="1.1"/>

  <text x="64" y="158" class="mono" font-size="10.5" letter-spacing="3" fill="#7FA8B5">
    BILATERAL SOVEREIGN ARCHITECTURE · CKPIF · CANADA–KOREA
  </text>

  <text x="64" y="232" class="serif" font-weight="700" font-size="60" fill="#F4EFE3" letter-spacing="-0.5">
    A Canada–Korea Pacific
  </text>
  <text x="64" y="296" class="serif" font-weight="700" font-size="60" fill="#F4EFE3" letter-spacing="-0.5">
    Infrastructure Facility
  </text>

  <text x="64" y="346" class="serif" font-style="italic" font-size="22" fill="#C08D60">
    A defensive bilateral co-issuance architecture for middle-power sovereignty.
  </text>

  <g transform="translate(0, 420)">
    <line x1="64"  y1="0" x2="1136" y2="0" stroke="#2E4A63" stroke-width="0.5"/>

    <g transform="translate(64, 36)">
      <text x="0" y="0" class="mono" font-weight="500" font-size="38" fill="#F4EFE3">US$25–40B</text>
      <text x="0" y="34" class="mono" font-size="10.5" letter-spacing="2.4" fill="#C08D60">INDICATIVE PROGRAMME SIZE</text>
    </g>

    <line x1="430" y1="12" x2="430" y2="80" stroke="#2E4A63" stroke-width="0.5"/>

    <g transform="translate(456, 36)">
      <text x="0" y="0" class="mono" font-weight="500" font-size="38" fill="#F4EFE3">50 / 50</text>
      <text x="0" y="34" class="mono" font-size="10.5" letter-spacing="2.4" fill="#C08D60">CANADA–KOREA OWNERSHIP</text>
    </g>

    <line x1="852" y1="12" x2="852" y2="80" stroke="#2E4A63" stroke-width="0.5"/>

    <g transform="translate(876, 36)">
      <text x="0" y="0" class="mono" font-weight="500" font-size="38" fill="#F4EFE3">+50–80 bp</text>
      <text x="0" y="34" class="mono" font-size="10.5" letter-spacing="2.4" fill="#C08D60">OVER 30Y US TREASURY</text>
    </g>

    <line x1="64" y1="100" x2="1136" y2="100" stroke="#2E4A63" stroke-width="0.5"/>
  </g>

  <text x="64" y="580" class="mono" font-size="10.5" letter-spacing="2.2" fill="#7FA8B5">
    EDITOR · JESSE JAMES · VICTORIA, BC
  </text>
  <text x="1136" y="580" class="mono" font-size="10.5" letter-spacing="2.2" fill="#7FA8B5" text-anchor="end">
    NPSI.CA/WP1/
  </text>
